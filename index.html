<body>
<div class="wrap">

<div class="toast" id="toast"></div>
<script>
/* ---------- 基础 ---------- */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function fstamp(d){
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' '
       + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function uniq(a){ var r = []; a.forEach(function(x){ if (r.indexOf(x) < 0) r.push(x); }); return r; }

var ORGS = ['贵溪市中医院','赤壁市人民医院','南昌市第一医院','金华广福医院','遂川第一人民医院',
            '四川大学华西医院','郑州大学第一附属医院','杭州全景医学影像诊断中心'];
var TOOLS = ['CT胸部骨折辅助诊断（推想）','CT胸部骨折辅助诊断（联影）','CT胸部肺结节辅助诊断（联影）',
             'CT胸部肺结节辅助诊断（推想）','骨龄DR量化评估(联影)','CTA头颈部辅助诊断（联影）',
             'CTA心脏冠心病辅助诊断（联影）','非门控钙化积分CT辅助诊断(联影)',
             'PET/CT肿瘤辅助诊断（推想）','颅脑AIR辅助诊断（联影）'];
var ITEMS = ['CT胸部平扫','CT胸部增强','CT颅脑平扫','MR颅脑平扫','MR腹部平扫','DR骨龄评估'];
var NAMES = ['WANG HU','ZhangYuXi','李红','陈刚','刘洋','赵敏','孙健','周强','卫红','蒋文'];
var DEVS  = ['CT','MR','DR'];

var TROWS = (function(){
  var out = [], chk = new Date(2026, 2, 30, 14, 11, 53), req = new Date(2026, 10, 4, 11, 31, 57);
  for (var i = 0; i < 486; i++){
    var c1 = new Date(req.getTime());
    var c2 = new Date(c1.getTime() + (3 + i % 9) * 60000);
    var state = (i % 6 === 0) ? '计算失败' : (i % 4 === 0 ? '计算中' : '计算成功');
    var tool = TOOLS[i % TOOLS.length];
    var dev = tool.indexOf('骨龄DR') >= 0 ? 'DR' : (tool.indexOf('颅脑') >= 0 ? 'MR' : 'CT');
    var item = tool.indexOf('骨龄DR') >= 0 ? 'DR骨龄评估'
             : tool.indexOf('颅脑') >= 0 ? 'MR颅脑平扫'
             : tool.indexOf('头颈部') >= 0 ? 'CTA头颈部血管'
             : tool.indexOf('心脏') >= 0 ? 'CTA冠状动脉'
             : tool.indexOf('PET') >= 0 ? 'PET/CT全身'
             : (i % 2 ? 'CT胸部平扫' : 'CT胸部增强');
    out.push({
      id: 'T' + i,
      tool: tool,
      dev: dev,
      state: state,
      item: item,
      uid: '1.3.12.2.1107.5.2.12.' + (20260330 + i) + '.' + (1000 + i * 7),
      time: fstamp(chk),
      req: fstamp(req),
      calc1: fstamp(c1),
      calc2: fstamp(c2),
      reqid: '4062' + (66 + (i % 40)) + '…',
      org: ORGS[i % ORGS.length],
      name: NAMES[i % NAMES.length],
      pat: 'PAT' + (20260000 + i * 3),
      study: 'CN2026' + (734568 - i),
      url: '',
      updated: ''
    });
    chk = new Date(chk.getTime() - (2 + i % 5) * 86400000);
    req = new Date(req.getTime() - (1 + i % 4) * 60000 - 13000);
  }
  return out;
})();

/* ---------- 列 ---------- */
var COLS = [
  { k:'tool',  t:'AI工具',     w:252 },
  { k:'state', t:'状态',       w:110 },
  { k:'item',  t:'检查项目',   w:148 },
  { k:'uid',   t:'UID',        w:198 },
  { k:'time',  t:'检查时间',   w:158 },
  { k:'req',   t:'发起时间',   w:158 },
  { k:'calc',  t:'AI计算时间', w:170 },
  { k:'reqid', t:'请求ID',     w:112 },
  { k:'op',    t:'操作',       w:212 }
];

var S = { tab:'all', tool:'', state:'', item:'', uid:'', reqid:'',
          chkFrom:'', chkTo:'', reqFrom:'', reqTo:'', calcFrom:'', calcTo:'',
          page:1, size:10, hide:{}, sel:{}, drw:'', upd:[] };

/* ---------- 过滤 / 渲染 ---------- */
function filtered(){
  var f = function (v, s){ return !s || String(v).toUpperCase().indexOf(String(s).toUpperCase()) >= 0; };
  return TROWS.filter(function (r){
    if (S.tool && r.tool !== S.tool) return false;
    if (S.state && r.state !== S.state) return false;
    if (!f(r.item, S.item) || !f(r.uid, S.uid) || !f(r.reqid, S.reqid)) return false;
    if (S.chkFrom && r.time < S.chkFrom) return false;
    if (S.chkTo   && r.time > S.chkTo)   return false;
    if (S.reqFrom && r.req  < S.reqFrom) return false;
    if (S.reqTo   && r.req  > S.reqTo)   return false;
    if (S.calcFrom && r.calc1 < S.calcFrom) return false;
    if (S.calcTo   && r.calc1 > S.calcTo)   return false;
    return true;
  });
}

function dotOf(st){
  var c = st === '计算成功' ? '#00C49F' : (st === '计算中' ? '#1890FF' : '#FF4D4F');
  return '<span class="dot"><i style="background:' + c + '"></i>' + esc(st) + '</span>';
}

function render(){
  var rows = filtered();
  var maxP = Math.max(1, Math.ceil(rows.length / S.size));
  if (S.page > maxP) S.page = maxP;
  var start = (S.page - 1) * S.size;
  var pageRows = rows.slice(start, start + S.size);

  var cols = COLS.filter(function (c){ return !S.hide[c.k]; });
  document.getElementById('thRow').innerHTML =
      '<th class="cc"><input type="checkbox" id="ckAll"></th>'
    + cols.map(function (c){ return '<th>' + esc(c.t) + '</th>'; }).join('');

  var tb = document.getElementById('tb');
  if (!pageRows.length){
    tb.innerHTML = '<tr><td colspan="' + (cols.length + 1) + '"><div class="empty">没有符合条件的数据</div></td></tr>';
  } else {
    tb.innerHTML = pageRows.map(function (r){
      var on = !!S.sel[r.id];
      var cells = cols.map(function (c){
        if (c.k === 'state') return '<td class="nw">' + dotOf(r.state) + '</td>';
        if (c.k === 'calc')  return '<td><div class="c2"><span>' + esc(r.calc1) + '</span><span>' + esc(r.calc2) + '</span></div></td>';
        if (c.k === 'op')    return '<td class="nw">'
          + '<a class="lnk" data-view="' + r.id + '">查看报告</a>'
          + '<a class="lnk" data-img="' + r.id + '">原始影像</a>'
          + '<a class="lnk" data-life="' + r.id + '">状态</a>'
          + (r.state === '计算成功' ? '' : '<a class="lnk warn" data-upd="' + r.id + '">更新</a>') + '</td>';
        if (c.k === 'tool' || c.k === 'uid' || c.k === 'item')
          return '<td><span class="ell" title="' + esc(r[c.k]) + '">' + esc(r[c.k]) + '</span></td>';
        return '<td class="nw">' + esc(r[c.k]) + '</td>';
      }).join('');
      return '<tr' + (on ? ' class="sel"' : '') + '><td class="cc"><input type="checkbox" data-ck="' + r.id + '"'
        + (on ? ' checked' : '') + '></td>' + cells + '</tr>';
    }).join('');
  }

  var selN = Object.keys(S.sel).filter(function (k){ return S.sel[k]; }).length;
  var btns = '<button class="p" data-p="' + (S.page - 1) + '"' + (S.page <= 1 ? ' disabled' : '') + '>‹</button>';
  var nums = [];
  for (var n = 1; n <= maxP; n++) if (n <= 3 || n === maxP || Math.abs(n - S.page) <= 1) nums.push(n);
  var last = 0;
  nums.forEach(function (n){
    if (last && n - last > 1) btns += '<span class="gap">…</span>';
    btns += '<button class="p' + (n === S.page ? ' on' : '') + '" data-p="' + n + '">' + n + '</button>';
    last = n;
  });
  btns += '<button class="p" data-p="' + (S.page + 1) + '"' + (S.page >= maxP ? ' disabled' : '') + '>›</button>';

  document.getElementById('pg').innerHTML =
      '<span>共 <b>' + rows.length + '</b> 条</span><span>|</span><span>已选 <b>' + selN + '</b> 条</span>'
    + '<button class="p" data-clear="1" style="border:0;color:#1890FF">清除筛选</button>'
    + '<span class="sp"></span>' + btns
    + '<select id="pgSize">' + [10,20,50].map(function (n){
        return '<option value="' + n + '"' + (n === S.size ? ' selected' : '') + '>' + n + '条/页</option>';
      }).join('') + '</select>'
    + '<span class="jump">前往<input id="pgJump">页</span>';

  var ck = document.getElementById('ckAll');
  if (ck){
    ck.checked = pageRows.length > 0 && pageRows.every(function (r){ return S.sel[r.id]; });
    ck.indeterminate = pageRows.some(function (r){ return S.sel[r.id]; }) && !ck.checked;
  }
}

/* ---------- 更新状态 ---------- */
var OPERATOR = '钱多多';

function openUpd(id){
  var r = TROWS.filter(function (x){ return x.id === id; })[0];
  if (!r || r.state === '计算成功') return;
  S.upd = [id];
  document.getElementById('updMeta').innerHTML =
      '<b>' + esc(r.org) + '</b><span>' + esc(r.study) + '</span><span>' + esc(r.tool) + '</span>'
    + '<em>当前状态：' + esc(r.state) + '</em>';
  var opts = (r.state === '计算中') ? ['计算成功', '计算失败'] : ['计算成功'];
  document.getElementById('updStatus').innerHTML = opts.map(function (o){
    return '<option>' + o + '</option>';
  }).join('');
  document.getElementById('updUrl').value = r.url || '';
  document.getElementById('updUrl').classList.remove('err');
  [].forEach.call(document.querySelectorAll('input[name=rsn]'), function (x){ x.checked = false; });
  document.getElementById('updErr').style.display = 'none';
  document.getElementById('fLogs').style.display = (r.logs && r.logs.length) ? 'block' : 'none';
  document.getElementById('updLogs').innerHTML = (r.logs || []).map(function (l){
    return '<div class="lg"><span class="op">' + esc(l.user) + '</span><span class="tm">' + esc(l.time) + '</span>'
      + '<div>' + esc(l.text) + '</div></div>';
  }).join('');
  syncUpdForm();
  document.getElementById('mkUpd').classList.remove('hidden');
}
function syncUpdForm(){
  var st = document.getElementById('updStatus').value;
  var isFail = st === '计算失败';
  document.getElementById('fReason').style.display = isFail ? 'block' : 'none';
  document.getElementById('fUrl').style.display = isFail ? 'none' : 'block';
  document.getElementById('updTip').textContent = isFail
    ? '选择失败原因后，该条数据的计算状态将更新为「计算失败」'
    : '填写结果地址后，该条数据的计算状态将更新为「计算成功」，更新成功后不可再次修改';
}
function closeUpd(){ document.getElementById('mkUpd').classList.add('hidden'); S.upd = []; }

function doUpdate(){
  var id = S.upd[0];
  var r = TROWS.filter(function (x){ return x.id === id; })[0];
  if (!r) return;
  if (r.state === '计算成功'){ closeUpd(); toast('该数据已是计算成功，不允许再次更新'); return; }
  var st = document.getElementById('updStatus').value;
  var err = document.getElementById('updErr');
  err.style.display = 'none';
  var val = '';
  if (st === '计算失败'){
    var rd = document.querySelector('input[name=rsn]:checked');
    if (!rd){ err.textContent = '请选择失败原因'; err.style.display = 'block'; return; }
    val = rd.value;
    r.reason = val;
    r.url = '';
  } else {
    var u = document.getElementById('updUrl').value.trim();
    if (!/^https?:\/\/.+/i.test(u)){
      err.textContent = '请填写以 http:// 或 https:// 开头的结果地址';
      err.style.display = 'block';
      document.getElementById('updUrl').classList.add('err');
      return;
    }
    document.getElementById('updUrl').classList.remove('err');
    val = u;
    r.url = u;
    r.reason = '';
  }
  var ts = fstamp(new Date());
  r.state = st;
  r.updated = ts;
  r.logs = r.logs || [];
  r.logs.unshift({
    user: OPERATOR,
    time: ts.slice(0, 16),
    text: '更新"计算状态"为"' + st + '"，原因/url为："' + val + '"'
  });
  closeUpd(); render();
  if (S.drw) renderDrw();
  toast('已更新计算状态为「' + st + '」');
}

/* ---------- 影像生命周期 ---------- */
function lifeHtml(r){
  var ok = r.state === '计算成功';
  var run = r.state === '计算中';
  var head;
  if (ok){
    head = '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>计算成功</b>'
      + '<span class="tm">' + esc(r.calc2) + '</span><span class="tagg calc">计算</span></div>'
      + '<div class="tx">结果地址：' + esc(r.url || '—') + (r.updated ? '<br>更新时间：' + esc(r.updated) : '') + '</div>'
      + '<div class="ta"><button class="btn" data-view="' + r.id + '">查看结果</button></div></div></div>';
  } else if (run){
    head = '<div class="ti run"><div class="tdot">◔</div><div><div class="tt"><b>计算中</b>'
      + '<span class="tm">' + esc(r.calc1) + '</span><span class="tagg calc">计算</span></div>'
      + '<div class="tx">算法执行中，尚未返回结果</div>'
      + '<div class="ta"><button class="btn pri" data-upd="' + r.id + '">更新状态</button></div></div></div>';
  } else {
    head = '<div class="ti bad"><div class="tdot">✕</div><div><div class="tt"><b>计算失败</b>'
      + '<span class="tm">' + esc(r.calc2) + '</span><span class="tagg calc">计算</span></div>'
      + '<div class="tx">失败原因：序列【' + esc(r.uid) + '】错误<br>信息：'
      + esc(r.reason || '算法服务调用超时（>600s）') + '</div>'
      + '<div class="ta"><button class="btn" data-retry="' + r.id + '">↻ 手动重试</button>'
      + '<button class="btn pri" data-upd="' + r.id + '">更新状态</button></div></div></div>';
  }

  var logs = (r.logs || []).map(function (l){
    return '<div class="ti"><div class="tdot">✎</div><div><div class="tt"><b>状态更新</b>'
      + '<span class="tm">' + esc(l.time) + '</span><span class="tagg up">更新</span></div>'
      + '<div class="tx">操作人：' + esc(l.user) + '<br>操作时间：' + esc(l.time)
      + '<br>操作内容：' + esc(l.text) + '</div></div></div>';
  }).join('');

  return '<div class="tl">' + head + logs
    + '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>计算开始</b><span class="tm">' + esc(r.calc1)
      + '</span><span class="tagg calc">计算</span></div><div class="tx">算法开始执行，已分配计算资源</div></div></div>'
    + '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>算法发起</b><span class="tm">' + esc(r.calc1)
      + '</span><span class="tagg start">发起</span></div><div class="tx">调用厂商算法</div></div></div>'
    + '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>匹配成功 — 匹配中 4 款AI工具</b><span class="tm">'
      + esc(r.req) + '</span><span class="tagg match">匹配</span></div><div class="tx">根据匹配规则匹配中以下算法'
      + TOOLS.slice(0, 4).map(function (t){ return '<span class="alg">' + esc(t) + '</span>'; }).join('')
      + '</div></div></div>'
    + '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>影像归档成功</b><span class="tm">' + esc(r.req)
      + '</span><span class="tagg arch">归档</span></div><div class="tx">影像归档成功，共 1 个序列<br>图像张数：353</div></div></div>'
    + '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>请求接收完成</b><span class="tm">' + esc(r.req)
      + '</span><span class="tagg recv">接收</span></div><div class="tx">数据来源：PACS3</div></div></div>'
    + '</div>';
}

function renderDrw(){
  if (!S.drw) return;
  var r = TROWS.filter(function (x){ return x.id === S.drw; })[0];
  if (!r){ closeDrw(); return; }
  var b = document.getElementById('drwBadge');

function openDrw(id){ S.drw = id; document.getElementById('drw').classList.remove('hidden'); renderDrw(); }
function closeDrw(){ S.drw = ''; document.getElementById('drw').classList.add('hidden'); }

function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function (){ t.classList.remove('on'); }, 2200);
}
</script>
<script>
/* ---------- 云导入数据 ---------- */
var CNAMES = ['ZhangYuXi','WANG HU','李红','陈刚','刘洋','赵敏','孙健','周强'];
var CROWS = (function(){
  var out = [], base = new Date(2026, 9, 5, 13, 35, 13);
  for (var i = 0; i < 4096; i++){
    var t = new Date(base.getTime() - i * 37 * 60000);
    var u = new Date(t.getTime() + (5 + i % 9) * 3600000);
    out.push({
      id: 'C' + i, org: ORGS[i % ORGS.length], dev: DEVS[i % 3],
      name: CNAMES[i % CNAMES.length] + (i % 6 === 0 ? '…' : ''),
      pat: '00005' + (22391 + i * 3),
      study: 'DX01' + (34594 + i),
      time: fstamp(t), utime: fstamp(u),
      uid: '1.2.840.40823.1.1.1.' + (100000 + i * 7) + '.' + (i % 13),
      st: (i % 13 === 0) ? '发起失败' : (i % 3 === 0 ? '未发起' : '已发起'),
      stime: (i % 3 === 0) ? '' : fstamp(new Date(t.getTime() + 7200000))
    });
  }
  return out;
})();

var CL = { orgs:[], q:'', dev:'', name:'', pat:'', study:'', uid:'', status:'',
           from:'', to:'', ufrom:'', uto:'', page:1, size:10, sel:{} };

function clFiltered(){
  var f = function (v, s){ return !s || String(v).toUpperCase().indexOf(String(s).toUpperCase()) >= 0; };
  return CROWS.filter(function (r){
    if (CL.orgs.length && CL.orgs.indexOf(r.org) < 0) return false;
    if (CL.dev && r.dev !== CL.dev) return false;
    if (!f(r.name, CL.name) || !f(r.pat, CL.pat) || !f(r.study, CL.study) || !f(r.uid, CL.uid)) return false;
    if (CL.from && r.time < CL.from) return false;
    if (CL.to   && r.time > CL.to)   return false;
    if (CL.ufrom && r.utime < CL.ufrom) return false;
    if (CL.uto   && r.utime > CL.uto)   return false;
    if (CL.status && r.st !== CL.status) return false;
    return true;
  });
}

function msRender(){
  var all = uniq(CROWS.map(function (r){ return r.org; }));
  var shown = all.filter(function (o){ return !CL.q || o.indexOf(CL.q) >= 0; });
  document.getElementById('msCount').textContent = '共 ' + all.length + ' 家';
  document.getElementById('msList').innerHTML = shown.length
    ? shown.map(function (o){
        return '<label><input type="checkbox" data-morg="' + esc(o) + '"' +
          (CL.orgs.indexOf(o) >= 0 ? ' checked' : '') + '><span>' + esc(o) + '</span></label>';
      }).join('')
    : '<div class="none">没有匹配的机构</div>';
  var allCk = document.getElementById('msAll');
  allCk.checked = shown.length > 0 && shown.every(function (o){ return CL.orgs.indexOf(o) >= 0; });
  allCk.indeterminate = shown.some(function (o){ return CL.orgs.indexOf(o) >= 0; }) && !allCk.checked;
  var txt = CL.orgs.length === 0 ? '全部机构' : (CL.orgs.length === 1 ? CL.orgs[0] : CL.orgs.length + ' 家机构');
  document.querySelector('#msBox .msTxt').textContent = txt;
  document.querySelector('#msBox .msTxt').title = CL.orgs.join('、');
}

function clRender(){
  var rows = clFiltered();
  var maxP = Math.max(1, Math.ceil(rows.length / CL.size));
  if (CL.page > maxP) CL.page = maxP;
  var start = (CL.page - 1) * CL.size;
  var pageRows = rows.slice(start, start + CL.size);

  var tb = document.getElementById('cloudTb');
  if (!pageRows.length){
    tb.innerHTML = '<tr><td colspan="11"><div class="empty2">没有符合条件的数据</div></td></tr>';
  } else {
    tb.innerHTML = pageRows.map(function (r){
      var on = !!CL.sel[r.id];
      var sc = r.st === '已发起' ? '#52C41A' : (r.st === '发起失败' ? '#FF4D4F' : '#8C8C8C');
      var acts = '<a class="lnk2" data-clv="' + r.id + '">阅片</a>'
               + '<a class="lnk2" data-cld="' + r.id + '">详情</a>'
               + (r.st === '已发起' ? '' : '<a class="lnk2" data-csend="' + r.id + '">发起</a>');
      return '<tr><td class="cc"><input type="checkbox" data-crow="' + r.id + '"' + (on ? ' checked' : '') + '></td>'
        + '<td class="el" title="' + esc(r.org) + '">' + esc(r.org) + '</td>'
        + '<td>' + esc(r.dev) + '</td>'
        + '<td class="el" title="' + esc(r.name) + '">' + esc(r.name) + '</td>'
        + '<td>' + esc(r.pat) + '</td><td>' + esc(r.study) + '</td>'
        + '<td>' + esc(r.time) + '</td><td>' + esc(r.utime) + '</td>'
        + '<td class="el" title="' + esc(r.uid) + '">' + esc(r.uid) + '</td>'
        + '<td title="' + (r.stime ? '发起时间：' + esc(r.stime) : '尚未发起') + '">'
        +   '<span class="dot"><i style="background:' + sc + '"></i>' + esc(r.st) + '</span></td>'
        + '<td>' + acts + '</td></tr>';
    }).join('');
  }
  var selN = Object.keys(CL.sel).filter(function (k){ return CL.sel[k]; }).length;
  document.getElementById('cloudSel').textContent = '已选 ' + selN + ' 条';
  var nSent = rows.filter(function (r){ return r.st === '已发起'; }).length;
  var nWait = rows.filter(function (r){ return r.st === '未发起'; }).length;
  var nBad  = rows.filter(function (r){ return r.st === '发起失败'; }).length;
  document.getElementById('cInfo').innerHTML = '共 <b>' + rows.length + '</b> 条'
    + '<span class="cst ok">已发起 ' + nSent + '</span>'
    + '<span class="cst wait">未发起 ' + nWait + '</span>'
    + (nBad ? '<span class="cst bad">发起失败 ' + nBad + '</span>' : '');
  var sendable = Object.keys(CL.sel).filter(function (k){
    if (!CL.sel[k]) return false;
    var r = CROWS.filter(function (x){ return x.id === k; })[0];
    return r && r.st !== '已发起';
  }).length;
  var bs = document.getElementById('btnCloudSend');
  bs.disabled = sendable === 0;
  bs.textContent = sendable ? ('发起所选(' + sendable + ')') : '发起所选';

  var p = '<button data-cp="' + (CL.page - 1) + '"' + (CL.page <= 1 ? ' disabled' : '') + '>‹</button>';
  var nums = [];
  for (var n = 1; n <= maxP; n++) if (n <= 3 || n === maxP || Math.abs(n - CL.page) <= 1) nums.push(n);
  var last = 0;
  nums.forEach(function (n){
    if (last && n - last > 1) p += '<span>…</span>';
    p += '<button data-cp="' + n + '" class="' + (n === CL.page ? 'on' : '') + '">' + n + '</button>';
    last = n;
  });
  p += '<button data-cp="' + (CL.page + 1) + '"' + (CL.page >= maxP ? ' disabled' : '') + '>›</button>';
  document.getElementById('cPages').innerHTML = p;

  var ck = document.getElementById('ckPage');
  ck.checked = pageRows.length > 0 && pageRows.every(function (r){ return CL.sel[r.id]; });
  ck.indeterminate = pageRows.some(function (r){ return CL.sel[r.id]; }) && !ck.checked;
}

function sendRows(ids){
  var n = 0, ts = fstamp(new Date());
  ids.forEach(function (id){
    var r = CROWS.filter(function (x){ return x.id === id; })[0];
    if (!r || r.st === '已发起') return;
    r.st = '已发起'; r.stime = ts; n++;
  });
  return n;
}
function openCloud(){
  CL = { orgs:[], q:'', dev:'', name:'', pat:'', study:'', uid:'', status:'',
         from:'', to:'', ufrom:'', uto:'', page:1, size:10, sel:{} };
  ['cfDev','cfName','cfPat','cfStudy','cfUid','cfStatus','cfFrom','cfTo','cuFrom','cuTo','msQ'].forEach(function (id){
    document.getElementById(id).value = '';
  });
  document.getElementById('cSize').value = '10';
  document.getElementById('msPanel').classList.add('hidden');
  document.getElementById('cloudErr').textContent = '';
  msRender(); clRender();
  document.getElementById('mkCloud').classList.remove('hidden');
}
function closeCloud(){
  document.getElementById('mkCloud').classList.add('hidden');
  document.getElementById('msPanel').classList.add('hidden');
}
function cloudConfirm(){
  var n = Object.keys(CL.sel).filter(function (k){ return CL.sel[k]; }).length;
  var err = document.getElementById('cloudErr');
  if (!n){ err.textContent = '请先勾选需要导入的数据'; return; }
  err.textContent = '';
  closeCloud();
  toast('云导入已提交：共 ' + n + ' 条数据（示意）');
}

/* ---------- 绑定 ---------- */
(function init(){
  TOOLS.forEach(function (t){ document.getElementById('fTool').insertAdjacentHTML('beforeend', '<option>' + esc(t) + '</option>'); });
  document.getElementById('gearMenu').innerHTML = COLS.filter(function (c){ return c.k !== 'op'; })
    .map(function (c){ return '<label><input type="checkbox" data-col="' + c.k + '"' + (S.hide[c.k] ? '' : ' checked') + '>' + esc(c.t) + '</label>'; })
    .join('');

  var apply = function (){ S.page = 1; S.sel = {}; render(); };
  document.getElementById('fTool').onchange = function (){ S.tool = this.value; apply(); };
  document.getElementById('fState').onchange = function (){ S.state = this.value; apply(); };
  document.getElementById('fItem').oninput = function (){ S.item = this.value.trim(); apply(); };
  document.getElementById('fUid').oninput = function (){ S.uid = this.value.trim(); apply(); };
  document.getElementById('fReq').oninput = function (){ S.reqid = this.value.trim(); apply(); };
  [['fChkFrom','fChkTo','chkFrom','chkTo'], ['fReqFrom','fReqTo','reqFrom','reqTo'], ['fCalcFrom','fCalcTo','calcFrom','calcTo']]
    .forEach(function (p){
      [0,1].forEach(function (i){
        document.getElementById(p[i]).onchange = function (){
          S[p[2 + i]] = this.value.replace('T', ' '); apply();
        };
      });
    });

  document.getElementById('gearBtn').onclick = function (e){
    e.stopPropagation();
    document.getElementById('gearMenu').classList.toggle('hidden');
    document.getElementById('ddMenu').classList.add('hidden');
  };
  document.getElementById('gearMenu').onclick = function (e){ e.stopPropagation(); };
  document.getElementById('gearMenu').onchange = function (e){
    var el = e.target;
    var k = el.getAttribute && el.getAttribute('data-col');
    if (!k) return;
    S.hide[k] = !el.checked;
    if (Object.keys(S.hide).filter(function (x){ return S.hide[x]; }).length >= COLS.length - 1){
      S.hide[k] = false; el.checked = true;
    }
    render();
  };
  document.addEventListener('click', function (){
    document.getElementById('gearMenu').classList.add('hidden');
    document.getElementById('ddMenu').classList.add('hidden');
    document.getElementById('msPanel').classList.add('hidden');
  });

  document.getElementById('btnCalc').onclick = function (e){
    e.stopPropagation();
    document.getElementById('ddMenu').classList.toggle('hidden');
  };
  document.getElementById('ddMenu').onclick = function (e){
    e.stopPropagation();
    var a = e.target.getAttribute && e.target.getAttribute('data-ai');
    if (!a) return;
    var n = Object.keys(S.sel).filter(function (k){ return S.sel[k]; }).length;
    document.getElementById('ddMenu').classList.add('hidden');
    toast(n ? ('已提交' + (a === 'calc' ? '重新计算' : '重新匹配') + '：' + n + ' 条（示意）') : '请先勾选需要处理的数据');
  };
  document.getElementById('btnEnd').onclick = function (){
    var n = Object.keys(S.sel).filter(function (k){ return S.sel[k]; }).length;
    toast(n ? ('已结束 ' + n + ' 个任务（示意）') : '请先勾选需要结束的任务');
  };
  document.getElementById('btnRefresh').onclick = function (){ render(); toast('已刷新'); };
  document.getElementById('btnResetAll').onclick = function (){
    ['fTool','fState','fItem','fUid','fReq','fChkFrom','fChkTo','fReqFrom','fReqTo','fCalcFrom','fCalcTo']
      .forEach(function (id){ document.getElementById(id).value = ''; });
    S.tool = S.state = S.item = S.uid = S.reqid = '';
    S.chkFrom = S.chkTo = S.reqFrom = S.reqTo = S.calcFrom = S.calcTo = '';
    S.page = 1; S.sel = {}; render();
  };

  document.getElementById('tb').onclick = function (e){
    var t = e.target;
    var ck = t.getAttribute && t.getAttribute('data-ck');
    if (ck){ S.sel[ck] = t.checked; render(); return; }
    var id = t.getAttribute && (t.getAttribute('data-view') || t.getAttribute('data-img')
            || t.getAttribute('data-life') || t.getAttribute('data-upd'));
    if (!id) return;
    if (t.getAttribute('data-life')) { openDrw(id); return; }
    if (t.getAttribute('data-upd'))  { openUpd(id); return; }
    var r = TROWS.filter(function (x){ return x.id === id; })[0];
    toast((t.getAttribute('data-view') ? '打开报告：' : '打开原始影像：') + r.study + '（示意）');
  };
  document.getElementById('pg').onclick = function (e){
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-clear')){
      ['fTool','fState','fItem','fUid','fReq','fChkFrom','fChkTo','fReqFrom','fReqTo','fCalcFrom','fCalcTo']
        .forEach(function (id){ document.getElementById(id).value = ''; });
      S.tool = S.state = S.item = S.uid = S.reqid = '';
      S.chkFrom = S.chkTo = S.reqFrom = S.reqTo = S.calcFrom = S.calcTo = '';
      S.page = 1; S.sel = {}; render(); return;
    }
    var p = t.getAttribute && t.getAttribute('data-p');
    if (p){ S.page = +p; render(); }
  };
  document.getElementById('pg').onchange = function (e){
    if (e.target.id === 'pgSize'){ S.size = +e.target.value; S.page = 1; render(); }
    if (e.target.id === 'pgJump'){
      var n = parseInt(e.target.value, 10);
      if (n > 0){ S.page = n; render(); }
      e.target.value = '';
    }
  };
  document.getElementById('tb').addEventListener('click', function (e){
    if (e.target.id === 'ckAll'){
      var rows = filtered().slice((S.page - 1) * S.size, S.page * S.size);
      var on = e.target.checked;
      rows.forEach(function (r){ S.sel[r.id] = on; });
      render();
    }
  }, true);

  /* 更新状态弹窗 */
  document.getElementById('btnUpdOk').onclick = doUpdate;
  document.getElementById('updStatus').onchange = syncUpdForm;
  [].forEach.call(document.querySelectorAll('[data-ux]'), function (x){ x.onclick = closeUpd; });
  document.getElementById('mkUpd').onclick = function (e){ if (e.target === this) closeUpd(); };

  /* 影像生命周期 */
  document.getElementById('drw').onclick = function (e){
    var t = e.target;
    var u = t.getAttribute && t.getAttribute('data-upd');
    if (u){ openUpd(u); return; }
    var rt = t.getAttribute && t.getAttribute('data-retry');
    if (rt){ toast('已重新提交计算任务（示意）'); return; }
    var v = t.getAttribute && t.getAttribute('data-view');
    if (v){ var r = TROWS.filter(function (x){ return x.id === v; })[0]; toast('结果地址：' + (r.url || '—')); }
  };
  document.querySelector('[data-dx]').onclick = closeDrw;
  document.getElementById('drwRefresh').onclick = function (){ renderDrw(); toast('已刷新生命周期'); };

  /* 云导入 */
  document.getElementById('btnCloud').onclick = openCloud;
  document.getElementById('msBox').onclick = function (e){
    e.stopPropagation();
    document.getElementById('msPanel').classList.toggle('hidden');

    all.forEach(function (o){
      var k = CL.orgs.indexOf(o);
      if (on && k < 0) CL.orgs.push(o);
      if (!on && k >= 0) CL.orgs.splice(k, 1);
    });
    msRender();
  };
  document.getElementById('msList').onchange = function (e){
    var o = e.target.getAttribute && e.target.getAttribute('data-morg');
    if (!o) return;
    var k = CL.orgs.indexOf(o);
    if (e.target.checked && k < 0) CL.orgs.push(o);
    if (!e.target.checked && k >= 0) CL.orgs.splice(k, 1);
    msRender();
  };
  document.getElementById('cfQuery').onclick = function (){
    CL.dev = document.getElementById('cfDev').value;
    CL.status = document.getElementById('cfStatus').value;
    CL.name = document.getElementById('cfName').value.trim();
    CL.pat = document.getElementById('cfPat').value.trim();
    CL.study = document.getElementById('cfStudy').value.trim();
    CL.uid = document.getElementById('cfUid').value.trim();
    CL.from = document.getElementById('cfFrom').value.replace('T', ' ');
    CL.to = document.getElementById('cfTo').value.replace('T', ' ');
    CL.ufrom = document.getElementById('cuFrom').value.replace('T', ' ');
    CL.uto = document.getElementById('cuTo').value.replace('T', ' ');
    CL.page = 1; CL.sel = {}; clRender();
  };
  document.getElementById('cfReset').onclick = function (){
    ['cfDev','cfName','cfPat','cfStudy','cfUid','cfStatus','cfFrom','cfTo','cuFrom','cuTo'].forEach(function (id){
      document.getElementById(id).value = '';
    });
    CL.dev = CL.name = CL.pat = CL.study = CL.uid = ''; CL.status = '';
    CL.from = CL.to = CL.ufrom = CL.uto = '';
    CL.page = 1; CL.sel = {}; CL.q = '';
    document.getElementById('msQ').value = '';
    msRender(); clRender();
  };
  document.getElementById('cloudTb').onclick = function (e){
    var t = e.target;
    var ck = t.getAttribute && t.getAttribute('data-crow');
    if (ck){ CL.sel[ck] = t.checked; clRender(); return; }
    var sd = t.getAttribute && t.getAttribute('data-csend');
    if (sd){
      var n = sendRows([sd]);
      clRender();
      toast('已发起 ' + n + ' 条数据（示意）');
      return;
    }
    var v = t.getAttribute && (t.getAttribute('data-clv') || t.getAttribute('data-cld'));
    if (v){
      var r = CROWS.filter(function (x){ return x.id === v; })[0];
      toast((t.getAttribute('data-clv') ? '打开阅片：' : '查看详情：') + r.study + '（示意）');
    }
  };
  document.getElementById('btnCloudSend').onclick = function (){
    var ids = Object.keys(CL.sel).filter(function (k){ return CL.sel[k]; });
    var n = sendRows(ids);
    CL.sel = {};
    clRender();
    toast(n ? ('已发起 ' + n + ' 条数据（示意）') : '所选数据均已发起');
  };
  document.getElementById('ckPage').onclick = function (){
    var rows = clFiltered().slice((CL.page - 1) * CL.size, CL.page * CL.size);

    rows.forEach(function (r){ CL.sel[r.id] = on; });

  };
  document.getElementById('cPages').onclick = function (e){

  };

})();

var ALGO_W = [0.30, 0.22, 0.18, 0.13, 0.10, 0.07];
var ALGO_COLOR = ['#2F6BFF','#00A398','#FA8C16','#7C6CF0','#E5484D','#12B5CB'];

/* 突增注入：mult 为当日相对基线的放大倍数（1+mult 即环比倍数） */
var SPIKES = [
  { date:'2026-10-18', inst:null, mult:0.62 },   // 平台级：1.62×
  { date:'2026-10-26', inst:null, mult:0.92 },   // 平台级：1.92×
  { date:'2026-11-01', inst:null, mult:1.30 },   // 平台级：2.30×
  { date:'2026-10-30', inst:2,    mult:2.30 },   // 机构级：3.3×
  { date:'2026-10-22', inst:4,    mult:2.10 }    // 机构级：3.1×
];

function pad(n){ return String(n).padStart(2,'0'); }
function rnd(i){ var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
function fmtYmd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function fmtMd(d){ return pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function num(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function sum(a){ return a.reduce(function(x,y){ return x + y; }, 0); }
function avg(a){ return a.length ? sum(a) / a.length : 0; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* 生成 200 家机构：权重按幂律分布 */
function buildInsts(){
  var out = [], N = 200;
  var raw = [], total = 0;
  for (var i = 0; i < N; i++) { var w = 1 / Math.pow(i + 1, 1.16); raw.push(w); total += w; }
  var TOP = ['四川大学华西医院','郑州大学第一附属医院','北京协和医院','复旦大学附属中山医院',
             '中山大学附属第一医院','浙江大学医学院附属第二医院','华中科技大学同济医学院附属协和医院',
             '空军军医大学西京医院'];
  for (var k = 0; k < N; k++) {
    var city = CITIES[k % CITIES.length];
    var type = TYPES[Math.floor(k / CITIES.length) % TYPES.length];
    out.push({
      id: 'I' + k, idx: k,
      name: (k < TOP.length) ? TOP[k] : (city + type),
      w: raw[k] / total,
      tier: k < 8 ? 'head' : k < 50 ? 'mid' : 'tail'
    });
  }
  return out;
}
CITIES = CITIES.filter(function (v, i){ return CITIES.indexOf(v) === i; });
var INSTS = buildInsts();
var INST_BY_ID = {}; INSTS.forEach(function (x){ INST_BY_ID[x.id] = x; });

function buildDays(){
  var out = [], i = 0;
  var d = new Date(2026, 8, 5), end = new Date(2026, 10, 3);
  var PLAT = 820;                              // 平台日均（例）
  while (d <= end) {
    var dow = d.getDay(), wk = (dow === 0 || dow === 6) ? 0.76 : 1;
    var base = PLAT * wk * (1 + 0.06 * (rnd(i) - 0.5));
    var vals = {}, tot = 0;
    INSTS.forEach(function (I) {
      var v = base * I.w * (0.82 + 0.36 * rnd(i * 13 + I.idx));
      v = Math.round(v);
      if (I.tier === 'tail' && rnd(i * 5 + I.idx) < 0.12) v = 0;   // 小机构偶发空窗
      vals[I.id] = v; tot += v;
    });
    out.push({ date: fmtYmd(d), label: fmtMd(d), total: tot, vals: vals });
    d.setDate(d.getDate() + 1); i++;
  }
  return out;
}
var DAYS = buildDays();

/* 注入突增（在基础数据之上按倍数放大，保证触发预警） */
(function applySpikes(){
  SPIKES.forEach(function (s) {
    var day = DAYS.filter(function (d){ return d.date === s.date; })[0];
    if (!day) return;
    if (s.inst === null) {
      INSTS.forEach(function (I){
        day.vals[I.id] = Math.round((day.vals[I.id] || 0) * (1 + s.mult));
      });
    } else {
      var I = INSTS[s.inst];
      day.vals[I.id] = Math.round((day.vals[I.id] || 0) * (1 + s.mult));
    }
    day.total = INSTS.reduce(function (t, I){ return t + (day.vals[I.id] || 0); }, 0);
  });
})();

var S = {
  inst: '', range: 30, from: '', to: '', algo: '',
  rule: { k: 1.5, min: 50, minBase: 15 },
  kind: '', level: '',
  alPage: 1, alSize: 8
};

function curDays(){
  var ds = DAYS;
  if (S.from && S.to) ds = ds.filter(function (d){ return d.date >= S.from && d.date <= S.to; });
  else ds = ds.slice(Math.max(0, ds.length - S.range));
  return ds;
}
function valOf(d, id){ return id ? (d.vals[id] || 0) : d.total; }
function instName(id){ return INST_BY_ID[id] ? INST_BY_ID[id].name : ''; }

/* ============================================================================
   3. 图表
   ============================================================================ */
function el(tag, a){
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in a) e.setAttribute(k, a[k]);
  return e;
}
function niceMax(v){
  if (v <= 5) return Math.max(1, Math.ceil(v));
  var p = Math.pow(10, String(Math.ceil(v)).length - 1);
  var steps = [1,1.2,1.5,2,2.5,3,4,5,6,8,10];
  for (var i = 0; i < steps.length; i++) if (steps[i] * p >= v) return steps[i] * p;
  return 10 * p;
}

function drawLine(host, cfg){
  host.innerHTML = '';
  var W = 1000, H = cfg.h || 260, L = 46, R = 14, T = 12, B = 30;
  var labels = cfg.labels, series = cfg.series, maxV = 0;
  series.forEach(function (s){ s.data.forEach(function (v){ if (v > maxV) maxV = v; }); });
  if (cfg.threshold) maxV = Math.max(maxV, cfg.threshold.value * 1.1);
  if (cfg.bands) cfg.bands.forEach(function (b){ b.data.forEach(function (v){ if (v > maxV) maxV = v; }); });
  var yMax = niceMax(maxV * 1.1), iw = W - L - R, ih = H - T - B, n = labels.length;
  var X = function (i){ return L + (n === 1 ? iw / 2 : iw * i / (n - 1)); };
  var Y = function (v){ return T + ih - ih * (v / yMax); };

  var svg = el('svg', { viewBox:'0 0 ' + W + ' ' + H });
  svg.setAttribute('style', 'width:100%;height:' + H + 'px');

  for (var t = 0; t <= 4; t++) {
    var v = yMax * t / 4, yy = Y(v);
    svg.appendChild(el('line', { x1:L, y1:yy, x2:W-R, y2:yy, stroke:'#EEF1F5' }));
    var tx = el('text', { x:L-8, y:yy+4, 'text-anchor':'end', fill:'#8A94A6', 'font-size':'11' });
    tx.textContent = num(v); svg.appendChild(tx);
  }
  var yl = el('text', { x:L-8, y:T-2, 'text-anchor':'end', fill:'#8A94A6', 'font-size':'10.5' });
  yl.textContent = cfg.yUnit || '例'; svg.appendChild(yl);

  var step = Math.ceil(n / 12);
  labels.forEach(function (lb, i){
    if (i % step && i !== n - 1) return;
    var t2 = el('text', { x:X(i), y:H-10, 'text-anchor':'middle', fill:'#8A94A6', 'font-size':'11' });
    t2.textContent = lb; svg.appendChild(t2);
  });

  (cfg.bands || []).forEach(function (b){
    var d = b.data.map(function (v, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
    svg.appendChild(el('path', { d: d + ' L' + X(n-1).toFixed(1) + ' ' + (T+ih) + ' L' + X(0).toFixed(1) + ' ' + (T+ih) + ' Z',
      fill:b.color, opacity:b.opacity || .10 }));
  });

  if (cfg.threshold) {
    var ty = Y(cfg.threshold.value);
    svg.appendChild(el('line', { x1:L, y1:ty, x2:W-R, y2:ty, stroke:'#E5484D', 'stroke-width':1.4,
      'stroke-dasharray':'6 5', opacity:.85 }));
    var tt = el('text', { x:W-R-4, y:ty-6, 'text-anchor':'end', fill:'#E5484D', 'font-size':'11' });
    tt.textContent = cfg.threshold.label; svg.appendChild(tt);
  }

  series.forEach(function (s){
    var d = s.data.map(function (v, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
    svg.appendChild(el('path', { d: d, fill:'none', stroke:s.color, 'stroke-width':s.width || 2,
      'stroke-dasharray': s.dash || 'none', 'stroke-linejoin':'round' }));
    if (s.dots !== false && n <= 40) {
      s.data.forEach(function (v, i){
        var c = el('circle', { cx:X(i), cy:Y(v), r:s.dash ? 0 : 2.3, fill:'#fff', stroke:s.color, 'stroke-width':1.5 });
        c.appendChild(el('title', {})).textContent = labels[i] + '：' + num(v);
        svg.appendChild(c);
      });
    }
  });

  (cfg.marks || []).forEach(function (m){
    var cx = X(m.i), cy = Y(m.v);
    svg.appendChild(el('circle', { cx:cx, cy:cy, r:9, fill:'#E5484D', opacity:.14 }));
    var c2 = el('circle', { cx:cx, cy:cy, r:3.5, fill:'#E5484D', stroke:'#fff', 'stroke-width':1.5 });
    c2.appendChild(el('title', {})).textContent = m.tip || '';
    svg.appendChild(c2);
    var tx2 = el('text', { x:cx, y:cy-13, 'text-anchor':'middle', fill:'#C0392B', 'font-size':'10.5', 'font-weight':'600' });
    tx2.textContent = '↑突增'; svg.appendChild(tx2);
  });

  host.appendChild(svg);
}

function drawBars(host, cfg){
  host.innerHTML = '';
  var W = 1000, H = cfg.h || 250, L = 46, R = 14, T = 12, B = 40;
  var cats = cfg.cats, series = cfg.series, maxV = 0;
  series.forEach(function (s){ s.data.forEach(function (v){ if (v > maxV) maxV = v; }); });
  var yMax = niceMax(maxV * 1.1), iw = W - L - R, ih = H - T - B;
  var gw = iw / cats.length, bw = Math.min(46, gw / (series.length + 1.2));
  var Y = function (v){ return T + ih - ih * (v / yMax); };

  var svg = el('svg', { viewBox:'0 0 ' + W + ' ' + H });
  svg.setAttribute('style', 'width:100%;height:' + H + 'px');
  for (var t = 0; t <= 4; t++) {
    var v = yMax * t / 4, yy = Y(v);
    svg.appendChild(el('line', { x1:L, y1:yy, x2:W-R, y2:yy, stroke:'#EEF1F5' }));
    var tx = el('text', { x:L-8, y:yy+4, 'text-anchor':'end', fill:'#8A94A6', 'font-size':'11' });
    tx.textContent = num(v); svg.appendChild(tx);
  }
  cats.forEach(function (cat, ci){
    var gx = L + gw * ci + gw / 2;
    var totalW = bw * series.length + 3 * (series.length - 1);
    series.forEach(function (s, si){
      var v = s.data[ci] || 0, h = ih * (v / yMax);
      var bx = gx - totalW / 2 + si * (bw + 3);
      var r = el('rect', { x:bx, y:T + ih - h, width:bw, height:Math.max(1, h), rx:2, fill:s.color });
      r.appendChild(el('title', {})).textContent = cat + ' · ' + s.name + '：' + num(v);
      svg.appendChild(r);
    });
    var lb = el('text', { x:gx, y:H-22, 'text-anchor':'middle', fill:'#4B5563', 'font-size':'11' });
    lb.textContent = cat; svg.appendChild(lb);
  });
  host.appendChild(svg);
}

/* ============================================================================
   4. 计算
   ============================================================================ */
function pctile(arr, p){
  var a = arr.slice().sort(function (x, y){ return x - y; });
  if (!a.length) return 0;
  var i = (a.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (i - lo);
}

/* 平台级预警（基于全部机构合计） */
function platformAlerts(days){
  var out = [], v = days.map(function (d){ return d.total; });
  for (var i = 7; i < v.length; i++) {
    var base = avg(v.slice(i-7, i));
    var ratio = v[i] / Math.max(1, base), delta = v[i] - base;
    if (ratio >= S.rule.k && delta >= S.rule.min) {
      out.push({ kind:'平台', date:days[i].date, scope:'平台合计', id:'', cur:v[i], base:Math.round(base),
        delta:Math.round(delta), ratio:ratio, level: ratio >= 3 ? '高' : ratio >= 2 ? '中' : '低', status:'未处理' });
    }
  }
  return out;
}

/* 机构级预警：仅对日均 ≥ minBase 的机构判定，避免小机构噪声 */
function instAlerts(days){
  var out = [];
  var cands = INSTS.filter(function (I){ return I.tier !== 'tail' || I.idx < 60; });
  cands.forEach(function (I){
    if (S.inst && I.id !== S.inst) return;
    var v = days.map(function (d){ return d.vals[I.id] || 0; });
    for (var i = 7; i < v.length; i++) {
      var base = avg(v.slice(i-7, i));
      if (base < S.rule.minBase) continue;
      var ratio = v[i] / Math.max(1, base), delta = v[i] - base;
      if (ratio >= S.rule.k && delta >= Math.max(20, S.rule.min * 0.4)) {
        out.push({ kind:'机构', date:days[i].date, scope:I.name, id:I.id, cur:v[i], base:Math.round(base),
          delta:Math.round(delta), ratio:ratio, level: ratio >= 3 ? '高' : ratio >= 2 ? '中' : '低', status:'未处理' });
      }
    }
  });
  return out;
}

function allAlerts(days){
  var list = platformAlerts(days).concat(instAlerts(days));
  list.sort(function (a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return b.ratio - a.ratio;
  });
  return list;
}


function algoTotalsFor(days, instId){
  var base = days.reduce(function (s, d){ return s + valOf(d, instId); }, 0);
  var m = {};
  ALGOS.forEach(function (a, k){
    m[a] = (S.algo && S.algo !== a) ? 0 : Math.round(base * ALGO_W[k] * 1.06);
  });
  return m;
}

   5. 渲染
   ============================================================================ */
function renderKpis(days, alerts){
  var vals = days.map(function (d){ return valOf(d, S.inst); });
  var total = sum(vals), avgV = total / Math.max(1, vals.length);
  var peak = vals.length ? Math.max.apply(null, vals) : 0, pi = vals.indexOf(peak);
  var prevSeg = DAYS.slice(Math.max(0, DAYS.length - S.range * 2), Math.max(0, DAYS.length - S.range));
  var prevTotal = prevSeg.reduce(function (s, d){ return s + valOf(d, S.inst); }, 0);
  var mom = prevTotal ? (total - prevTotal) / prevTotal * 100 : 0;

  var k = [
    { lb:'接收影像总量', vl:num(total), unit:'例（study）', dt:'较上期 ' + pctTag(mom) },
    { lb:'日均接收量', vl:num(avgV), unit:'例/天', dt:'区间 ' + days.length + ' 天' },
    { lb:'单日峰值', vl:num(peak), unit:'例', dt:'出现在 ' + (days[pi] ? days[pi].label : '—') }
  ];
  document.getElementById('kpis').innerHTML = k.map(function (x){
    return '<div class="kpi"><div class="lb">' + x.lb + '</div>'
      + '<div class="vl">' + x.vl + '<em>' + x.unit + '</em></div>'
      + '<div class="dt">' + x.dt + '</div></div>';
  }).join('');
}
function pctTag(v){
  if (Math.abs(v) < 0.05) return '<span class="flat">持平</span>';
  return '<span class="' + (v > 0 ? 'up' : 'down') + '">' + (v > 0 ? '↑' : '↓') + ' '
    + Math.abs(v).toFixed(1) + '%</span>';
}

function renderDaily(days, alerts){
  var vals = days.map(function (d){ return valOf(d, S.inst); });
  var ma = vals.map(function (_, i){
    return Math.round(avg(vals.slice(Math.max(0, i - 6), i + 1)));
  });
  var thr = avg(vals) * S.rule.k;
  var marks = [];
  alerts.filter(function (a){ return S.inst ? a.id === S.inst : a.kind === '平台'; }).forEach(function (a){
    var i = days.map(function (d){ return d.date; }).indexOf(a.date);
    if (i >= 0) marks.push({ i:i, v:a.cur, tip:a.date + ' 平台接收 ' + num(a.cur) + ' 例（基线 ' + num(a.base) + '）' });
  });

  drawLine(document.getElementById('chDaily'), {
    labels: days.map(function (d){ return d.label; }),
    series: [
      { name:'每日接收量', color:'#2F6BFF', data:vals, width:2.2 },
      { name:'7 日均线', color:'#8A94A6', data:ma, dash:'5 4', width:1.5 }
    ],
    threshold: { value: Math.round(thr), label:'预警阈值 ' + num(Math.round(thr)) + ' 例' },
    marks: marks, h: 250
  });
  document.getElementById('lgDaily').innerHTML =
      '<span><i style="background:#2F6BFF"></i>' + (S.inst ? esc(instName(S.inst)) : '平台每日接收量') + '</span>'
    + '<span><i class="dash g"></i>7 日均线</span>'
    + '<span><i class="dash"></i>预警阈值 ' + num(Math.round(thr)) + '</span>'
    + '<span><i style="background:#E5484D"></i>突增点</span>';
}



function instTotals(days){
  return INSTS.map(function (I){
    var v = 0;
    for (var i = 0; i < days.length; i++) v += (days[i].vals[I.id] || 0);
    return { id:I.id, name:I.name, tier:I.tier, v:v };
  }).sort(function (a, b){ return b.v - a.v; });

function renderRank(days){

function heatColor(v, max){
  if (!v) return '#F7F9FC';
  var p = Math.min(1, v / (max || 1));
  var from = [234, 241, 255], to = [47, 107, 255];
  var c = from.map(function (f, i){ return Math.round(f + (to[i] - f) * Math.pow(p, 0.75)); });
  return 'rgb(' + c.join(',') + ')';
}
function textOn(v, max){ return (v / (max || 1)) > 0.55 ? '#fff' : '#1F2937'; }

function renderHeat(){ /* 已移除 */ }

function renderAlgo(days){

  var thr = avg(v) * S.rule.k;

    +     '<span>预警 <b style="color:#C0392B">' + myAlerts.length + '</b> 次</span>'
    +   '</div>'
    +   '<div class="legend" style="margin-bottom:4px"><span><i style="background:#2F6BFF"></i>每日接收量</span>'
    +     '<span><i class="dash g"></i>7 日均线</span><span><i class="dash"></i>自身阈值 ' + Math.round(thr) + '</span></div>'
    +   '<div class="chart" id="dlgChart"></div>'
    +   '<div style="margin-top:12px"><table class="tbl" id="dlgAlgo"></table></div>'
    + '</div>'
    + '<div class="ft"><button class="btn" data-x>关闭</button>'
    +   '<button class="btn pri" data-sel>在筛选区选中该机构</button></div></div>';
  document.body.appendChild(m);
  var close = function (){ m.remove(); };
  m.querySelector('.x').onclick = close;
  m.querySelector('[data-x]').onclick = close;
  m.addEventListener('click', function (e){ if (e.target === m) close(); });
  m.querySelector('[data-sel]').onclick = function (){
    S.inst = id;
    document.getElementById('fInst').value = I.name;
    close(); renderAll(); toast('已切换到：' + I.name);
  };

  drawLine(document.getElementById('dlgChart'), {
    labels: days.map(function (d){ return d.label; }),
    series: [
      { name:'每日接收量', color:'#2F6BFF', data:v, width:2 },
      { name:'7 日均线', color:'#8A94A6', data:ma, dash:'5 4', width:1.4 }
    ],
    threshold:{ value:Math.round(thr), label:'' }, h: 210
  });

  var totals = algoTotalsFor(days, id);
  var ssum = sum(ALGOS.map(function (a){ return totals[a]; }));
  var h = '<thead><tr><th>算法</th><th class="num">计算量</th><th class="num">占比</th><th class="num">日均</th></tr></thead><tbody>';
  ALGOS.forEach(function (a){
    if (S.algo && S.algo !== a) return;
    var x = totals[a] || 0;
    h += '<tr><td>' + esc(a) + '</td><td class="num">' + num(x) + '</td>'
      + '<td class="num">' + (ssum ? (x / ssum * 100).toFixed(1) : '0.0') + '%</td>'
      + '<td class="num">' + num(x / Math.max(1, days.length)) + '</td></tr>';
  });
  h += '</tbody>';
  document.getElementById('dlgAlgo').innerHTML = h;
}

function openAllInst(){
  var days = curDays();
  var rows = instTotals(days);
  var total = sum(rows.map(function (r){ return r.v; }));
  var m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="dlg wide"><h4>全部接入机构（' + rows.length + ' 家）<span class="x">✕</span></h4>'
    + '<div class="bd">'
    +   '<div class="f"><label style="flex:0 0 70px">搜索</label>'
    +     '<input id="aiQ" placeholder="输入机构名称过滤" style="flex:1;height:30px;border:1px solid #DCE3E1;border-radius:4px;padding:0 9px"></div>'
    +   '<div class="wrapx" style="max-height:400px"><table class="tbl" id="aiTbl"></table></div>'
    +   '<div class="pager" id="aiPager"></div>'
    + '</div><div class="ft"><button class="btn" data-x>关闭</button></div></div>';
  document.body.appendChild(m);
  var close = function (){ m.remove(); };
  m.querySelector('.x').onclick = close;
  m.querySelector('[data-x]').onclick = close;
  m.addEventListener('click', function (e){ if (e.target === m) close(); });

  var page = 1, size = 15, q = '';
  function draw(){
    var list = rows.filter(function (r){ return !q || r.name.indexOf(q) >= 0; });
    var maxP = Math.max(1, Math.ceil(list.length / size));
    if (page > maxP) page = maxP;
    var view = list.slice((page - 1) * size, page * size);
    var h = '<thead><tr><th>#</th><th>机构名称</th><th class="num">接收量</th>'
          + '<th class="num">占比</th><th class="num">日均</th><th>操作</th></tr></thead><tbody>';
    view.forEach(function (r){
      var rank = rows.map(function (x){ return x.id; }).indexOf(r.id) + 1;
      h += '<tr><td>' + rank + '</td><td>' + esc(r.name) + '</td>'
        + '<td class="num">' + num(r.v) + '</td>'
        + '<td class="num">' + (total ? (r.v / total * 100).toFixed(2) : '0.00') + '%</td>'
        + '<td class="num">' + num(r.v / Math.max(1, days.length)) + '</td>'
        + '<td class="op"><a data-open="' + r.id + '">详情</a></td></tr>';
    });
    h += '</tbody>';
    document.getElementById('aiTbl').innerHTML = h;
    var btns = '<button data-p="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>‹</button>';
    for (var p = 1; p <= maxP; p++) {
      if (p <= 3 || p === maxP || Math.abs(p - page) <= 1)
        btns += '<button data-p="' + p + '" class="' + (p === page ? 'on' : '') + '">' + p + '</button>';
    }
    btns += '<button data-p="' + (page + 1) + '"' + (page >= maxP ? ' disabled' : '') + '>›</button>';
    document.getElementById('aiPager').innerHTML =
        '<span>共 ' + list.length + ' 家 · 第 ' + page + '/' + maxP + ' 页</span>'
      + '<span style="display:flex;gap:6px">' + btns + '</span>';
    [].forEach.call(document.querySelectorAll('#aiPager [data-p]'), function (b){
      b.onclick = function (){ page = +b.getAttribute('data-p'); draw(); };
    });
    [].forEach.call(document.querySelectorAll('#aiTbl [data-open]'), function (a){
      a.onclick = function (){ close(); openInstDetail(a.getAttribute('data-open')); };
    });
  }
  document.getElementById('aiQ').onkeydown = function (e){
    if (e.key !== 'Enter') return;
    q = this.value.trim(); page = 1; draw();
  };
  draw();
}

function openRule(){
  var m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="dlg"><h4>预警规则设置<span class="x">✕</span></h4>'
    + '<div class="bd">'
    + '<div class="f"><label>突增倍数阈值</label><input type="number" id="rk" step="0.1" min="1.1" value="' + S.rule.k + '"></div>'
    + '<div class="f"><label>最小增量（例）</label><input type="number" id="rmin" step="10" min="1" value="' + S.rule.min + '"></div>'
    + '<div class="f"><label>机构级最小基线</label><input type="number" id="rbase" step="5" min="1" value="' + S.rule.minBase + '"></div>'
    + '<div class="tip">判定逻辑：当日接收量 ≥ 前 7 日均值 × 倍数阈值，且增量 ≥ 最小增量 → 触发突增。<br>'
    + '平台级按平台合计判定；机构级按单家机构判定，且仅对「7 日均值 ≥ 机构级最小基线」的机构生效，'
    + '避免日均只有几例的机构从 2 例涨到 6 例就报警。等级：≥3× 高、≥2× 中、其余低。</div>'
    + '</div><div class="ft"><button class="btn" data-x>取消</button>'
    + '<button class="btn pri" data-ok>保存并重算</button></div></div>';
  document.body.appendChild(m);
  var close = function (){ m.remove(); };
  m.querySelector('.x').onclick = close;
  m.querySelector('[data-x]').onclick = close;
  m.addEventListener('click', function (e){ if (e.target === m) close(); });
  m.querySelector('[data-ok]').onclick = function (){
    var k = parseFloat(document.getElementById('rk').value);
    var mn = parseInt(document.getElementById('rmin').value, 10);
    var bs = parseInt(document.getElementById('rbase').value, 10);
    if (!(k > 1)) { toast('倍数阈值需大于 1'); return; }
    if (!(mn > 0)) { toast('最小增量需大于 0'); return; }
    if (!(bs > 0)) { toast('机构级最小基线需大于 0'); return; }
    S.rule.k = k; S.rule.min = mn; S.rule.minBase = bs;
    close(); renderAll(); toast('规则已更新，已按新规则重算');
  };
}

/* ============================================================================
   7. 交互
   ============================================================================ */
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(function (){ t.classList.remove('on'); }, 1800);
}

function fillInstList(kw){
  var list = INSTS.filter(function (I){ return !kw || I.name.indexOf(kw) >= 0 || I.id.toLowerCase().indexOf(kw.toLowerCase()) >= 0; });
  var h = '<div class="it" data-id="">全部机构（' + INSTS.length + ' 家）<em>聚合</em></div>';
  h += list.slice(0, 60).map(function (I){
    var v = (DAYS[DAYS.length - 1].vals[I.id] || 0);
    return '<div class="it' + (S.inst === I.id ? ' on' : '') + '" data-id="' + I.id + '">'
      + esc(I.name) + '<em>' + num(v) + '</em></div>';
  }).join('');
  if (list.length > 60) h += '<div class="none">还有 ' + (list.length - 60) + ' 家，请继续输入关键字</div>';
  if (!list.length && kw) h = '<div class="none">未找到匹配机构</div>';
  document.getElementById('sList').innerHTML = h;
  [].forEach.call(document.querySelectorAll('#sList .it'), function (it){
    it.onclick = function (){
      var id = it.getAttribute('data-id');
      S.inst = id;
      document.getElementById('fInst').value = id ? instName(id) : '';
      closeDrop(); renderAll(); toast(id ? '已选中：' + instName(id) : '已切回全部机构');
    };
  });
}
function openDrop(){
  document.getElementById('sDrop').classList.remove('hidden');
  fillInstList(document.getElementById('sQ').value.trim());
}
function closeDrop(){
  document.getElementById('sDrop').classList.add('hidden');
  document.getElementById('sQ').value = '';
}

function initFilters(){
  ALGOS.forEach(function (a){
    document.getElementById('fAlgo').insertAdjacentHTML('beforeend', '<option value="' + a + '">' + a + '</option>');
  });
  var ds = curDays();
  document.getElementById('fFrom').value = ds[0].date;
  document.getElementById('fTo').value = ds[ds.length - 1].date;

  var si = document.getElementById('fInst');
  si.onfocus = openDrop;
  si.onclick = openDrop;
  si.oninput = function (){ openDrop(); fillInstList(si.value.trim()); };
  document.getElementById('sQ').oninput = function (){ fillInstList(this.value.trim()); };
  document.addEventListener('click', function (e){
    var w = document.getElementById('sWrap');
    if (!w.contains(e.target)) closeDrop();
  });

  [].forEach.call(document.querySelectorAll('#fRange button'), function (b){
    b.onclick = function (){
      [].forEach.call(document.querySelectorAll('#fRange button'), function (x){ x.classList.remove('on'); });
      b.classList.add('on');
      S.range = +b.getAttribute('data-v'); S.from = ''; S.to = '';
      var d = curDays();
      document.getElementById('fFrom').value = d[0].date;
      document.getElementById('fTo').value = d[d.length - 1].date;
      renderAll();
    };
  });
  document.getElementById('fAlgo').onchange = function (){ S.algo = this.value; renderAll(); };

  document.getElementById('btnQuery').onclick = function (){
    var f = document.getElementById('fFrom').value, t = document.getElementById('fTo').value;
    if (f && t && f > t) { toast('开始日期不能晚于结束日期'); return; }
    S.from = f; S.to = t;
    renderAll(); toast('已按条件查询');
  };
  document.getElementById('btnReset').onclick = function (){
    S.inst = ''; S.algo = ''; S.range = 30; S.from = ''; S.to = ''; S.kind = ''; S.level = '';
    document.getElementById('fInst').value = '';
    document.getElementById('fAlgo').value = '';
    [].forEach.call(document.querySelectorAll('#fRange button'), function (x){
      x.classList.toggle('on', x.getAttribute('data-v') === '30');
    });
    var d = curDays();
    document.getElementById('fFrom').value = d[0].date;
    document.getElementById('fTo').value = d[d.length - 1].date;
    renderAll(); toast('已重置筛选条件');
  };

  document.getElementById('btnAllInst').onclick = openAllInst;
  document.getElementById('btnRule').onclick = openRule;
  document.getElementById('btnExport').onclick = function (){ toast('已导出当前区间的监测数据（示意）'); };
}

initFilters();
renderAll();
</script>
</body>
</html>
</template>

<script>
var CACHE = {};
function pageHtml(key){
  if (CACHE[key]) return CACHE[key];
  var html = document.getElementById(key === 'task' ? 'tplTask' : 'tplMonitor').innerHTML;
  /* template 解析会丢弃 head/body 标签，覆盖样式追加到末尾 */
  html = html.replace(/<\/html>/i, '') + '<style>.nav{display:none!important}</style>';
  CACHE[key] = html;
  return html;
}
function showPage(key, name){
  document.getElementById('ph').style.display = 'none';
  var f = document.getElementById('frame');
  f.style.display = ''; f.srcdoc = pageHtml(key);
  document.getElementById('crumb').innerHTML = '运维管理 / <b>' + name + '</b>';
}
(function(){
  var side = document.getElementById('side');
  document.getElementById('miOps').onclick = function (){
    this.classList.toggle('open');
    document.getElementById('subOps').classList.toggle('hide');
  };
  [].forEach.call(side.querySelectorAll('.sub .mi'), function (m){
    m.onclick = function (){
      [].forEach.call(side.querySelectorAll('.sub .mi'), function (x){ x.classList.remove('on'); });
      m.classList.add('on');
      document.getElementById('miOps').classList.add('open');
      document.getElementById('subOps').classList.remove('hide');
      if (m.getAttribute('data-v') === 'task') showPage('task', '任务管理');
      else showPage('monitor', '数据监控');
    };
  });
  showPage('task', '任务管理');
})();
</script>
</body>
</html>
